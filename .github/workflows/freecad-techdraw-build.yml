name: FreeCAD 1.1.4 - TechDraw Test-Build V8

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Zuerst Patch-Pruefung auswaehlen"
        required: true
        default: patch-only
        type: choice
        options:
          - patch-only
          - full-build

permissions:
  contents: read

jobs:
  build-windows:
    name: FreeCAD 1.1.4 - ${{ inputs.mode }}
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - name: Checkout test files
        uses: actions/checkout@v4

      - name: Get official FreeCAD 1.1.4 sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/FC | Out-Null
          git clone -c core.autocrlf=false --depth 1 --branch 1.1.4 --recurse-submodules --shallow-submodules https://github.com/FreeCAD/FreeCAD.git C:/FC/source
          if ($LASTEXITCODE -ne 0) { throw "Downloading FreeCAD source failed." }
          git -C C:/FC/source rev-parse HEAD

      - name: Apply TechDraw change using verified C++ anchors
        shell: pwsh
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'FreeCAD_1.1.4_TechDraw_BatchedSvgHatch_KORRIGIERT.patch'
          $source = 'C:/FC/source/src/Mod/TechDraw/Gui/QGIFace.cpp'
          if (!(Test-Path $patch)) { throw "Missing C++ patch: $patch" }
          if (!(Test-Path $source)) { throw "Missing FreeCAD source: $source" }
          $script = Join-Path $env:RUNNER_TEMP 'apply_verified_hatch.py'
          @'
          import re
          import sys
          from pathlib import Path

          source_path, patch_path = map(Path, sys.argv[1:3])
          source = source_path.read_bytes().decode('utf-8-sig').replace('\r\n', '\n')
          patch_lines = patch_path.read_bytes().decode('utf-8-sig').splitlines()

          # Read the six original change blocks. Avoid applying fragile Git line contexts.
          hunks = []
          current = None
          for line in patch_lines:
              if re.match(r'^@@ -\d+,\d+ \+\d+,\d+ @@', line):
                  if current is not None:
                      hunks.append(current)
                  current = []
              elif current is not None and line.startswith((' ', '+', '-')):
                  current.append(line)
              elif line.startswith('*** End Patch'):
                  break
          if current is not None:
              hunks.append(current)
          if len(hunks) != 6:
              raise RuntimeError(f'Expected 6 C++ change blocks, got {len(hunks)}')

          def additions(i):
              return '\n'.join(line[1:] for line in hunks[i] if line.startswith('+')) + '\n'

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: found {n} matching locations, expected 1. Source NOT modified.')
              print(f'OK: {label}')
              return text.replace(old, new, 1)

          if 'BatchedSvgHatchRect' in source:
              raise RuntimeError('Source already modified; refusing to modify it again.')

          # 1. Qt header
          source = replace_once(source,
              '# include <QTransform>\n',
              additions(0) + '# include <QTransform>\n',
              'Qt include')

          # 2. Experimental renderer class
          source = replace_once(source,
              'using DU = DrawUtil;\n',
              'using DU = DrawUtil;\n' + additions(1),
              'BatchedSvgHatchRect class')

          # 3. Use new renderer in QGIFace constructor
          source = replace_once(source,
              '    m_svgHatchArea = new QGCustomRect();\n',
              additions(2),
              'Qt graphics item constructor')

          # 4-6. Make three targeted edits inside buildSvgHatch only.
          start_token = 'void QGIFace::buildSvgHatch()'
          end_token = 'void QGIFace::buildPixHatch()'
          if source.count(start_token) != 1 or source.count(end_token) != 1:
              raise RuntimeError('Could not isolate buildSvgHatch exactly once.')
          start = source.index(start_token)
          end = source.index(end_token, start)
          body = source[start:end]

          # Insert before the hatch rectangle setup; surrounding numeric lines
          # can differ across minor source revisions.
          targets = re.findall(r'(?m)^    m_svgHatchArea->setRect\([^\n]*\);$', body)
          if len(targets) != 1:
              raise RuntimeError(f'Hatch rectangle: found {len(targets)} anchor lines, expected 1.')
          body = replace_once(body, targets[0] + '\n', additions(3) + targets[0] + '\n',
              'Reset cached hatch tiles')

          body = replace_once(body,
              '    long int tileCount = 0;\n',
              additions(4) + '    long int tileCount = 0;\n',
              'Batched tile configuration and original-path switch')

          end_marker = '    QPointF faceCenterToMRect = mapToItem(m_svgHatchArea, faceCenter);\n'
          body = replace_once(body, end_marker, additions(5) + end_marker,
              'End original-path switch')

          source = source[:start] + body + source[end:]
          if source.count('class BatchedSvgHatchRect final') != 1:
              raise RuntimeError('Batched renderer insertion did not validate.')
          if source.count('#if TECHDRAW_BATCH_SVG_HATCH') < 3:
              raise RuntimeError('Conditional C++ blocks are missing.')
          # Write only after ALL checks succeeded.
          source_path.write_bytes(source.encode('utf-8'))
          print('SUCCESS: all six C++ changes applied to verified source locations.')
          '@ | Set-Content -Path $script -Encoding utf8
          python $script $source $patch
          if ($LASTEXITCODE -ne 0) { throw "C++ changes could not be applied safely." }
          git -C C:/FC/source diff --check
          if ($LASTEXITCODE -ne 0) { throw "Git whitespace validation failed." }
          git -C C:/FC/source diff --stat

      - name: Download official FreeCAD 1.1 LibPack
        if: ${{ inputs.mode == 'full-build' }}
        shell: pwsh
        run: |
          $url = 'https://github.com/FreeCAD/FreeCAD-LibPack/releases/download/3.1.1.3/LibPack-1.1.0-v3.1.1.3-Release.7z'
          New-Item -ItemType Directory -Force C:/FC/libpack-unpack | Out-Null
          curl.exe -fL --retry 3 --output C:/FC/libpack.7z $url
          if ($LASTEXITCODE -ne 0) { throw "LibPack download failed." }
          7z x C:/FC/libpack.7z '-oC:/FC/libpack-unpack' -y
          if ($LASTEXITCODE -ne 0) { throw "LibPack extraction failed." }
          $extracted = 'C:/FC/libpack-unpack/LibPack-1.1.0-v3.1.1.3-Release'
          if (!(Test-Path $extracted)) { throw "Expected LibPack folder not found; inspect archive structure." }
          Move-Item -Path $extracted -Destination C:/FC/libpack

      - name: Configure with Visual Studio 2022
        if: ${{ inputs.mode == 'full-build' }}
        shell: pwsh
        run: |
          cmake -S C:/FC/source -B C:/FC/build --preset release -A x64 `
            -DCMAKE_VS_NO_COMPILE_BATCHING=ON `
            -DFREECAD_USE_PCH=OFF `
            -DFREECAD_RELEASE_PDB=OFF `
            -DFREECAD_LIBPACK_DIR=C:/FC/libpack `
            -DFREECAD_COPY_DEPEND_DIRS_TO_BUILD=ON `
            -DFREECAD_COPY_LIBPACK_BIN_TO_BUILD=ON `
            -DFREECAD_COPY_PLUGINS_BIN_TO_BUILD=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Compile FreeCAD
        if: ${{ inputs.mode == 'full-build' }}
        shell: pwsh
        run: |
          cmake --build C:/FC/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "FreeCAD compilation failed." }

      - name: Install complete FreeCAD test version
        if: ${{ inputs.mode == 'full-build' }}
        shell: pwsh
        run: |
          # Build/bin by itself is NOT a complete FreeCAD application.
          # Use the official CMake install step to collect GUI modules,
          # Python workbenches, resources and executable in one tree.
          cmake --install C:/FC/build --config Release --prefix C:/FC/installed
          if ($LASTEXITCODE -ne 0) { throw "CMake installation failed." }

          $installed = 'C:/FC/installed'
          $bin = Join-Path $installed 'bin'
          if (!(Test-Path (Join-Path $bin 'FreeCAD.exe'))) {
            throw "No FreeCAD.exe found in installed/bin. Inspect install layout."
          }

          # Copy runtime DLLs, Qt plugins and Python runtime prepared by LibPack.
          # The build/bin folder contains third-party dependencies needed to run
          # the installed FreeCAD.exe on machines without Visual Studio.
          Copy-Item -Path 'C:/FC/build/bin/*' -Destination $bin -Recurse -Force

          if (!(Test-Path (Join-Path $installed 'data'))) {
            throw "The installation is missing the data resource folder."
          }
          $techDrawModules = @(Get-ChildItem -Path $installed -Recurse -File -ErrorAction Stop |
            Where-Object { $_.Name -match '^TechDrawGui\.(pyd|dll)$' })
          if ($techDrawModules.Count -eq 0) {
            throw "TechDrawGui module is absent; refusing to package an unusable build."
          }
          Write-Host 'Compiled TechDraw GUI module(s):'
          $techDrawModules | ForEach-Object { Write-Host $_.FullName }
          Write-Host 'Installed root folders:'
          Get-ChildItem $installed -Directory | ForEach-Object { Write-Host $_.Name }

      - name: Package complete standalone test version
        if: ${{ inputs.mode == 'full-build' }}
        shell: pwsh
        run: |
          $installed = 'C:/FC/installed'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'FreeCAD-1.1.4-TechDraw-Windows-COMPLETE.7z'
          Push-Location $installed
          try {
            7z a -t7z -mx=5 $archive '.\*'
            if ($LASTEXITCODE -ne 0) { throw "Packaging complete installation failed." }
          } finally {
            Pop-Location
          }

      - name: Upload test build
        if: ${{ inputs.mode == 'full-build' }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeCAD-1.1.4-TechDraw-Test-Windows-COMPLETE
          path: FreeCAD-1.1.4-TechDraw-Windows-COMPLETE.7z
          retention-days: 7
          if-no-files-found: error
